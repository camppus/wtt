services:
  postgres:
    image: postgres:latest
    container_name: wtt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wtt
    ports:
      - "5432:5432"
    volumes:
      - wtt_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wtt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: wtt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wtt_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wtt_postgres_data:
  wtt_redis_data: